name: Deploy zu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig; laufende Deploys nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional: YouTube-Zugangsdaten als Repository-Variablen hinterlegen (Settings → Secrets and variables → Actions → Variables)
          VITE_YT_API_KEY: ${{ vars.YT_API_KEY }}
          VITE_YT_CLIENT_ID: ${{ vars.YT_CLIENT_ID }}
          VITE_YT_CLIENT_SECRET: ${{ vars.YT_CLIENT_SECRET }}
          # Optional: Adresse der eigenen Weiterleitung für http-Anbieter (z. B. https://mein-pc.xyz.ts.net)
          VITE_PROXY_URL: ${{ vars.PROXY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
